name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: finance
          POSTGRES_USER: finance_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_app -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECRET_KEY: ci-test-secret-key-12345678901234567890
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: finance
      DATABASE_USER: finance_app
      DATABASE_PASSWORD: ci_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Create test database
        run: |
          PGPASSWORD=ci_password psql \
            -h localhost \
            -U finance_app \
            -d finance \
            -c "CREATE DATABASE finance_test;"

      - name: Run tests
        run: python -m pytest